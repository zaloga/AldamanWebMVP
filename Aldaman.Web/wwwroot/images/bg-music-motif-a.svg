<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 900" fill="currentColor">
  <!-- Musical Staff Wave Flow & Treble Clef Repeating Tile -->
  <defs>
    <g id="music-motif-row">
      <!-- Musical Staff Wave Flow -->
      <g opacity="0.65">
        <path d="M 60 270 C 220 220, 360 360, 520 280 C 680 200, 800 240, 940 180" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" />
        <path d="M 75 285 C 235 235, 375 375, 535 295 C 695 215, 815 255, 955 195" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" />
        <path d="M 90 300 C 250 250, 390 390, 550 310 C 710 230, 830 270, 970 210" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" />
        <path d="M 105 315 C 265 265, 405 405, 565 325 C 725 245, 845 285, 985 225" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" />
        <path d="M 120 330 C 280 280, 420 420, 580 340 C 740 260, 860 300, 1000 240" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" />
      </g>

      <!-- Left Single Treble Clef and flourishes (scale ~0.58) -->
      <g transform="translate(65, 135) scale(0.58)">
        <!-- Treble Clef main body -->
        <path d="M 140 370 C 120 370 100 355 100 335 C 100 310 120 295 140 295 C 158 295 172 308 172 325 C 172 348 152 365 130 365 C 102 365 75 338 75 298 C 75 242 120 188 155 132 C 175 100 190 60 190 20 C 190 10 186 0 178 0 C 168 0 160 15 152 42 C 138 92 122 170 122 235 C 100 248 80 272 80 305 C 80 348 112 385 158 385 C 168 385 178 382 188 377 L 188 415 C 188 450 175 480 152 480 C 138 480 128 470 128 458 C 128 448 136 440 146 440 C 150 440 155 442 158 445 C 158 435 150 428 140 428 C 120 428 105 444 105 464 C 105 490 130 505 160 505 C 198 505 215 470 215 415 L 215 285 C 228 270 236 250 236 228 C 236 185 198 155 155 155 C 148 155 142 156 135 158 C 142 118 156 70 172 35 C 176 27 180 20 182 16 C 184 28 182 45 178 68 C 166 135 148 215 148 280 C 158 275 170 272 182 272 C 218 272 245 295 245 330 C 245 368 215 398 175 398 C 162 398 150 392 140 385 Z" />
        <!-- Botanical leaf accents left -->
        <path d="M 65 260 C 45 250 35 225 45 205 C 55 215 65 240 65 260 Z" />
        <path d="M 50 285 C 30 285 15 270 20 250 C 32 260 45 272 50 285 Z" />
        <path d="M 85 180 C 70 160 70 135 85 120 C 95 138 95 162 85 180 Z" />
        <path d="M 125 100 C 115 80 120 55 138 45 C 140 65 135 88 125 100 Z" />
        <path d="M 215 95 C 235 80 260 85 270 102 C 252 110 230 108 215 95 Z" />
        <path d="M 220 150 C 245 145 268 158 272 178 C 255 180 232 170 220 150 Z" />
      </g>

      <!-- Flowing Notes along the wave -->
      <!-- Note 1 -->
      <g transform="translate(320, 240)">
        <ellipse cx="18" cy="20" rx="14" ry="10" transform="rotate(-25 18 20)" />
        <line x1="28" y1="16" x2="28" y2="-45" stroke="currentColor" stroke-width="3.5" stroke-linecap="round" />
        <path d="M 28 -45 C 42 -40 50 -25 52 -10 C 46 -22 38 -30 28 -32" />
        <!-- Leaf on note stem -->
        <path d="M 28 -15 C 38 -22 48 -20 52 -12 C 45 -10 36 -10 28 -15 Z" />
      </g>

      <!-- Note 2 (Beamed pair) -->
      <g transform="translate(430, 260)">
        <ellipse cx="14" cy="20" rx="12" ry="9" transform="rotate(-25 14 20)" />
        <ellipse cx="64" cy="12" rx="12" ry="9" transform="rotate(-25 64 12)" />
        <line x1="23" y1="17" x2="23" y2="-40" stroke="currentColor" stroke-width="3" />
        <line x1="73" y1="9" x2="73" y2="-48" stroke="currentColor" stroke-width="3" />
        <polygon points="22,-40 74,-48 74,-39 22,-31" />
        <!-- Small swirl -->
        <path d="M 73 -48 C 85 -55 95 -50 96 -40 C 97 -32 90 -28 85 -30" fill="none" stroke="currentColor" stroke-width="2" />
      </g>

      <!-- Note 3 (Sixteenth beamed group) -->
      <g transform="translate(580, 210)">
        <ellipse cx="12" cy="20" rx="11" ry="8" transform="rotate(-25 12 20)" />
        <ellipse cx="48" cy="15" rx="11" ry="8" transform="rotate(-25 48 15)" />
        <ellipse cx="84" cy="10" rx="11" ry="8" transform="rotate(-25 84 10)" />
        <line x1="20" y1="17" x2="20" y2="-38" stroke="currentColor" stroke-width="2.5" />
        <line x1="56" y1="12" x2="56" y2="-43" stroke="currentColor" stroke-width="2.5" />
        <line x1="92" y1="7" x2="92" y2="-48" stroke="currentColor" stroke-width="2.5" />
        <polygon points="19,-38 93,-48 93,-42 19,-32" />
        <polygon points="19,-29 93,-39 93,-34 19,-24" />
      </g>

      <!-- Notes and flourishes extending towards the right -->
      <!-- Quarter note with leaf flourish -->
      <g transform="translate(740, 160)">
        <ellipse cx="16" cy="18" rx="13" ry="9.5" transform="rotate(-25 16 18)" />
        <line x1="26" y1="14" x2="26" y2="-42" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" />
        <path d="M 26 -42 C 40 -38 48 -24 50 -10 C 44 -20 36 -28 26 -30" />
        <path d="M 26 -16 C 36 -23 46 -21 50 -14 C 43 -12 34 -12 26 -16 Z" />
      </g>

      <!-- Eighth note pair with connecting beam and floral leaves -->
      <g transform="translate(830, 140)">
        <ellipse cx="14" cy="20" rx="12" ry="9" transform="rotate(-25 14 20)" />
        <ellipse cx="58" cy="12" rx="12" ry="9" transform="rotate(-25 58 12)" />
        <line x1="23" y1="17" x2="23" y2="-38" stroke="currentColor" stroke-width="3" />
        <line x1="67" y1="9" x2="67" y2="-46" stroke="currentColor" stroke-width="3" />
        <polygon points="22,-38 68,-46 68,-38 22,-30" />
        <!-- Botanical leaf accents on right wave -->
        <path d="M 67 -46 C 78 -52 88 -48 89 -38 C 90 -30 84 -26 79 -28" fill="none" stroke="currentColor" stroke-width="2" />
        <path d="M 45 -14 C 55 -20 64 -18 67 -12 C 60 -10 52 -10 45 -14 Z" />
      </g>

      <!-- Ambient decorative floating dots / berries -->
      <circle cx="210" cy="180" r="4.5" />
      <circle cx="230" cy="165" r="3" />
      <circle cx="390" cy="340" r="4" />
      <circle cx="410" cy="355" r="2.5" />
      <circle cx="530" cy="360" r="5" />
      <circle cx="550" cy="375" r="3" />
      <circle cx="705" cy="195" r="4.5" />
      <circle cx="725" cy="180" r="3" />
      <circle cx="925" cy="125" r="4" />
      <circle cx="945" cy="110" r="2.5" />
    </g>
  </defs>

  <!-- Top half: Original flow with single treble clef on left (height 0..450) -->
  <use href="#music-motif-row" x="0" y="0" />

  <!-- Bottom half: Horizontally flipped flow (stranově prohozené, height 450..900) -->
  <g transform="translate(1000, 450) scale(-1, 1)">
    <use href="#music-motif-row" x="0" y="0" />
  </g>
</svg>
